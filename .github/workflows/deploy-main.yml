name: Deploy release

on:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: almis-backend:main-${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - name: Package host configuration
        run: |
          tar -czf "$RUNNER_TEMP/deployment-files.tar.gz" -C deploy \
            manage.py compose.main.yml compose.preview.yml README.md
      - uses: actions/upload-artifact@v4
        with:
          name: main-deployment
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/deployment-files.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, almis-onprem]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: main-deployment
          path: ${{ runner.temp }}/almis-main
      - name: Deploy the tested release image
        run: |
          set -euo pipefail
          # A release must be a commit that main already contains.
          status=$(gh api "repos/$REPOSITORY/compare/main...$COMMIT" --jq '.status')
          if [[ "$status" != identical && "$status" != behind ]]; then
            echo "::error::$GITHUB_REF_NAME points at $COMMIT, which is not on main."
            exit 1
          fi
          docker load -i "$RUNNER_TEMP/almis-main/image.tar"
          files=$(mktemp -d "$RUNNER_TEMP/almis-config.XXXXXX")
          tar -xzf "$RUNNER_TEMP/almis-main/deployment-files.tar.gz" -C "$files"
          python3 "$files/manage.py" prepare
          python3 "$HOME/.local/share/almis/deploy/manage.py" main \
            --image "almis-backend:main-$COMMIT"
          if ! curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
            --retry 5 --retry-delay 3 https://api.almishotel.com/health; then
            # The host's mobile DNS resolver can cache a missing A record.
            # Retrieve a current public IPv4 address while preserving TLS verification.
            address=$(curl --fail --silent --show-error --max-time 20 \
              -H 'accept: application/dns-json' \
              'https://cloudflare-dns.com/dns-query?name=api.almishotel.com&type=A' | \
              python3 -c 'import json,sys; print(next(a["data"] for a in json.load(sys.stdin).get("Answer", []) if a["type"] == 1))')
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
              --retry 5 --retry-delay 3 --resolve "api.almishotel.com:443:$address" \
              https://api.almishotel.com/health
          fi
