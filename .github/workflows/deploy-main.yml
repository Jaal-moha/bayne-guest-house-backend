name: Deploy main

on:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: almis-backend:main-${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - name: Package host configuration
        run: |
          tar -czf "$RUNNER_TEMP/deployment-files.tar.gz" -C deploy \
            manage.py compose.main.yml compose.preview.yml README.md
      - uses: actions/upload-artifact@v4
        with:
          name: main-deployment
          path: |
            ${{ runner.temp }}/image.tar
            ${{ runner.temp }}/deployment-files.tar.gz
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, almis-onprem]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: main-deployment
          path: ${{ runner.temp }}/almis-main
      - name: Deploy the tested main image
        run: |
          set -euo pipefail
          current=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$current" != "$COMMIT" ]]; then
            echo "Skipping a superseded main commit."
            exit 0
          fi
          docker load -i "$RUNNER_TEMP/almis-main/image.tar"
          files=$(mktemp -d "$RUNNER_TEMP/almis-config.XXXXXX")
          tar -xzf "$RUNNER_TEMP/almis-main/deployment-files.tar.gz" -C "$files"
          python3 "$files/manage.py" prepare
          python3 "$HOME/.local/share/almis/deploy/manage.py" main \
            --image "almis-backend:main-$COMMIT"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            https://api.almishotel.com/health
