name: Deploy PR preview

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: preview-pr-${{ inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # The same merge commit that passed CI is also the preview build context.
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: almis-backend:pr-${{ inputs.pr_number }}-${{ inputs.head_sha }}
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: preview-deployment-${{ inputs.pr_number }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: [self-hosted, linux, x64, almis-onprem]
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ inputs.pr_number }}
      HEAD_SHA: ${{ inputs.head_sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: preview-deployment-${{ inputs.pr_number }}
          path: ${{ runner.temp }}/almis-preview-${{ inputs.pr_number }}
      - name: Deploy the tested preview image
        id: deploy
        run: |
          set -euo pipefail
          status=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '[.state, .head.sha] | join(" ")')
          if [[ "$status" != "open $HEAD_SHA" ]]; then
            echo "Skipping a closed or superseded PR preview."
            exit 0
          fi
          docker load -i "$RUNNER_TEMP/almis-preview-$PR_NUMBER/image.tar"
          # Use the trusted host script installed by main, never a PR's host scripts.
          python3 "$HOME/.local/share/almis/deploy/manage.py" preview \
            --pr "$PR_NUMBER" --image "almis-backend:pr-$PR_NUMBER-$HEAD_SHA"
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Update the preview URL
        if: steps.deploy.outputs.deployed == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const issue_number = Number(process.env.PR_NUMBER);
            const marker = '<!-- almis-preview -->';
            const body = `${marker}\nPreview: https://pr-${issue_number}-api.almishotel.com\nThis preview has its own empty database and is removed when the PR closes.`;
            const params = { ...context.repo, issue_number };
            const comments = await github.paginate(github.rest.issues.listComments, params);
            const existing = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...params, body });
            }

  teardown:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, almis-onprem]
    timeout-minutes: 10
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Remove the preview and disposable database
        run: |
          python3 "$HOME/.local/share/almis/deploy/manage.py" remove-preview --pr "$PR_NUMBER"
